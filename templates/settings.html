{% extends 'base.html' %}
{% block content %}
<div class="settings-head">
  <div><div class="eyebrow">ADMINISTRAÇÃO</div><h1>Configurações de monitoramento</h1><p>Defina a frequência das verificações e os limites de consulta DNS.</p></div>
  <a class="btn" href="{{ url_for('smtp_settings') }}">Configurar SMTP e alertas →</a>
</div>
<div class="form-panel simple-settings">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Intervalo de verificação (minutos)
      <input name="interval" type="number" min="1" max="10080" value="{{ interval }}" required>
    </label>
    <label>Timeout DNS (segundos)
      <input name="timeout" type="number" min="0.5" max="30" step="0.5" value="{{ timeout }}" required>
    </label>
    <button class="btn primary" type="submit">Salvar configurações</button>
  </form>
</div>
{% endblock %}
